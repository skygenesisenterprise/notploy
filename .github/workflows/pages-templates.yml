name: templates

# Publishes the template gallery and blueprint files as templates.notploy.com.
#
#   this repo -> build templates/app -> notploy-templates repo, gh-pages branch
#             -> GitHub Pages (Deploy from a branch) -> templates.notploy.com
#
# One-time setup, outside this workflow:
#   1. create the target repository (default: skygenesisenterprise/notploy-templates)
#   2. Settings -> Pages -> Source: "Deploy from a branch", gh-pages / (root)
#   3. add a fine-grained token as the PAGES_PUBLISH_TOKEN secret, with
#      "Contents: Read and write" on the target repository only
#   4. set templates.notploy.com as the custom domain in the Pages settings
on:
  push:
    branches: [master]
    paths:
      - "templates/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/pages-templates.yml"
  pull_request:
    branches: [master]
    paths:
      - "templates/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/pages-templates.yml"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and verify only, publish nothing"
        type: boolean
        default: false

concurrency:
  group: pages-templates-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24.4.0"
  PNPM_VERSION: "10.22.0"
  TARGET_REPOSITORY: ${{ vars.PAGES_TEMPLATES_REPOSITORY || 'skygenesisenterprise/notploy-templates' }}
  CUSTOM_DOMAIN: ${{ vars.TEMPLATES_SITE_URL_HOSTNAME || 'templates.notploy.com' }}

jobs:
  build:
    name: Build notploy-templates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm --filter=@notploy/templates-app run build

      - name: Verify export output
        run: |
          set -eo pipefail
          out="templates/app/dist"
          for required in index.html meta.json; do
            if [ ! -f "$out/$required" ]; then
              echo "::error::$out/$required is missing from the export"
              exit 1
            fi
          done
          if [ ! -d "$out/blueprints" ] || [ -z "$(find "$out/blueprints" -mindepth 1 -maxdepth 1 -type d -print -quit)" ]; then
            echo "::error::$out/blueprints contains no template assets"
            exit 1
          fi

          echo "$CUSTOM_DOMAIN" > "$out/CNAME"

          bytes="$(du -sb "$out" | cut -f1)"
          if [ "$bytes" -gt 900000000 ]; then
            echo "::error::Export is $(numfmt --to=iec "$bytes"), too close to the 1 GB GitHub Pages limit"
            exit 1
          fi
          echo "Templates export is $(du -sh "$out" | cut -f1)."

      - uses: actions/upload-artifact@v4
        with:
          name: templates-pages
          path: templates/app/dist

  publish:
    name: Publish notploy-templates
    if: github.event_name != 'pull_request' && inputs.dry-run != true
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUBLISH_TOKEN: ${{ secrets.PAGES_PUBLISH_TOKEN }}
    steps:
      - name: Verify the publish credentials
        run: |
          set -eo pipefail
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::PAGES_PUBLISH_TOKEN is not set. Add a fine-grained token with Contents: Read and write on $TARGET_REPOSITORY."
            exit 1
          fi
          echo "Publishing to $TARGET_REPOSITORY (gh-pages)"

      - uses: actions/download-artifact@v4
        with:
          name: templates-pages
          path: templates/app/dist

      - name: Publish
        env:
          OUT: templates/app/dist
        run: |
          set -eo pipefail
          work="$(mktemp -d)"
          cp -a "$OUT/." "$work/"
          cd "$work"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push --force \
            "https://x-access-token:${PUBLISH_TOKEN}@github.com/${TARGET_REPOSITORY}.git" \
            HEAD:refs/heads/gh-pages
          echo "Published https://${CUSTOM_DOMAIN}/ from $GITHUB_SHA"
