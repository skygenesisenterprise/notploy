name: Docker Publish

# Publishes the product container images to the GitHub Container Registry.
#
#   GitHub Actions -> Buildx -> GHCR -> cosign (keyless)
#
# Publishing is tag-only. Each package has its own `v<major>.<minor>.<patch>`
# tag suffix (for example, `v1.2.3-cloud` publishes only `notploy-cloud`).
#
# The self-hosted suffix additionally publishes a GitHub Release: a running
# server discovers its updates through the Releases API and pulls the image
# whose tag is that release tag, so a release has to exist for every `-app`
# tag. The other images are released by their own workflows.
#
# The `select` job filters the catalog down to the images the pushed tag
# actually publishes, so `v1.0.2-app` shows one job instead of seven (six of
# them disabled). Adding an image means adding it to the catalog in `select`
# and adding its suffix to the tag filters above. The build context is always
# the repository root because the whole monorepo is a single pnpm workspace.
#
# Pull requests do not run this workflow at all: ci.yml's `docker` job already
# builds the images (amd64, no push) so a pull request stays fast and this job
# can hold `packages: write` without ever being reachable from a fork. That is
# also why the permissions below are granted to the job rather than to the
# workflow.
on:
  push:
    tags:
      - "v*.*.*-app"
      - "v*.*.*-cloud"
      - "v*.*.*-mcp"
      - "v*.*.*-github"
      - "v*.*.*-website"
      - "v*.*.*-docs"
      - "v*.*.*-templates"

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # ghcr.io/<owner>/<image>. Override with the IMAGE_PREFIX repository variable
  # to publish under a different owner (or a mirror on forks).
  IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX || format('ghcr.io/{0}', github.repository_owner) }}

jobs:
  # The pushed tag selects exactly one image (`v1.0.2-app` publishes only
  # `notploy`). The matrix is filtered here rather than letting every job
  # disable itself, so a tag push shows a single job in the run instead of
  # seven, six of them no-ops.
  select:
    name: Select images for the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      any: ${{ steps.select.outputs.any }}
      version: ${{ steps.select.outputs.version }}
    steps:
      - name: Select the images published by ${{ github.ref_name }}
        id: select
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-(app|cloud|mcp|github|website|docs|templates)$ ]]; then
            echo "::error::Unsupported Docker image tag: $TAG_NAME"
            exit 1
          fi
          echo "version=v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
          variant="${BASH_REMATCH[4]}"

          # Catalog of publishable images. Adding an image means adding it here
          # and adding its suffix to the tag filters above.
          #
          # `platforms` defaults to linux/amd64,linux/arm64 when omitted.
          read -r -d '' CATALOG <<'JSON' || true
          [
            {
              "image": "notploy",
              "file": "./Dockerfile",
              "target": "selfhosted",
              "platforms": "linux/amd64",
              "tag_suffix": "-app",
              "description": "Notploy self-hosted (dashboard, server and build tooling)"
            },
            {
              "image": "notploy-cloud",
              "file": "./Dockerfile",
              "target": "cloud",
              "tag_suffix": "-cloud",
              "description": "Notploy Cloud (dashboard + server)"
            },
            {
              "image": "notploy-mcp",
              "file": "./packages/mcp/Dockerfile",
              "tag_suffix": "-mcp",
              "description": "Notploy MCP server"
            },
            {
              "image": "notploy-github",
              "file": "./packages/github/Dockerfile",
              "tag_suffix": "-github",
              "description": "Notploy GitHub integration"
            },
            {
              "image": "notploy-website",
              "file": "./web/Dockerfile.website",
              "platforms": "linux/amd64",
              "tag_suffix": "-website",
              "description": "Notploy official website"
            },
            {
              "image": "notploy-docs",
              "file": "./web/Dockerfile.docs",
              "tag_suffix": "-docs",
              "description": "Notploy documentation"
            },
            {
              "image": "notploy-templates",
              "file": "./templates/Dockerfile",
              "tag_suffix": "-templates",
              "description": "Notploy templates gallery"
            }
          ]
          JSON

          selected=$(jq -c --arg suffix "-$variant" '[ .[] | select(.tag_suffix == $suffix) ]' <<< "$CATALOG")

          if [ "$(jq 'length' <<< "$selected")" -eq 0 ]; then
            echo "::error::No image publishes the '$variant' variant"
            exit 1
          fi

          echo "any=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -c . <<< "$selected")" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "::notice::publishing \(.image) from \(.file)"' <<< "$selected"

  publish:
    name: ${{ matrix.image }}
    needs: select
    if: needs.select.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing mints a short-lived OIDC token to Fulcio; without
      # this the sign step fails with "no OIDC token found".
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          # cosign (keyless signing) needs the full tag history to resolve the
          # commit that an image was built from.
          fetch-depth: 0

      - name: Check the image can be built
        id: select
        env:
          IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.file }}
        run: |
          set -euo pipefail

          # An image can be listed before its Dockerfile lands; it is then
          # reported and left out instead of failing the whole matrix.
          if [ ! -f "$DOCKERFILE" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skipping $IMAGE: '$DOCKERFILE' does not exist yet"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Derive tags
        id: meta
        if: steps.select.outputs.enabled == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{major}}.{{minor}}.{{patch}},prefix=v,suffix=${{ matrix.tag_suffix }},value=${{ needs.select.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},prefix=v,suffix=${{ matrix.tag_suffix }},value=${{ needs.select.outputs.version }}
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=skygenesisenterprise
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: docker/setup-buildx-action@v4
        if: steps.select.outputs.enabled == 'true'

      - name: Log in to ${{ env.IMAGE_PREFIX }}
        if: steps.select.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_PREFIX }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        id: build
        if: steps.select.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

      - name: Install cosign
        if: steps.select.outputs.enabled == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: steps.select.outputs.enabled == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Signing every tag would burn a Fulcio/OIDC certificate per tag; the
          # digest is what consumers actually pin to, so sign that once.
          cosign sign --yes \
            "${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${DIGEST}"

      - name: Upload image metadata
        if: steps.select.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: image-metadata-${{ matrix.image }}
          path: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta.outputs.labels }}
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Publish the GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The image must be pullable before the release advertises it, otherwise a
    # server that already sees the release could be offered a missing tag.
    needs: publish
    if: endsWith(github.ref_name, '-app')
    permissions:
      contents: write
    steps:
      # Idempotent: re-running the workflow updates the existing release instead
      # of failing on a tag that already has one.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          
      - name: Prepare release assets
        run: |
          cp install.sh install-notploy.sh
          chmod +x install-notploy.sh
          
      - name: Publish the release for ${{ github.ref_name }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Notploy ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            install.sh
            install-notploy.sh
