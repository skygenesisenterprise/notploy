name: Docker Publish

# Publishes every container image in the repository to the GitHub Container
# Registry. One matrix entry per Dockerfile; the build context is always the
# repository root because the whole monorepo is a single pnpm workspace.
on:
  push:
    branches: [master]
    paths:
      - "Dockerfile*"
      - "packages/mcp/Dockerfile"
      - "web/Dockerfile.*"
      - "apps/**"
      - "packages/**"
      - "web/apps/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/docker-publish.yml"
    tags: ["v*"]
  pull_request:
    branches: [master]
    paths:
      - "Dockerfile*"
      - "packages/mcp/Dockerfile"
      - "web/Dockerfile.*"
      - "apps/**"
      - "packages/**"
      - "web/apps/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      image:
        # A choice input cannot use "" as an option value, so "all" is the
        # explicit "build everything" value rather than an empty string.
        description: "Image to publish (all images when 'all')"
        type: choice
        default: all
        options:
          - all
          - notploy
          - notploy-server
          - notploy-schedules
          - notploy-monitoring
          - notploy-mcp
          - notploy-docs
          - notploy-website
      push:
        description: "Push to the registry (off = build only)"
        type: boolean
        default: true

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  # Keyless cosign signing mints a short-lived OIDC token to Fulcio; without
  # this the sign step fails with "no OIDC token found".
  id-token: write

env:
  # ghcr.io/<owner>/<image>. Override with the IMAGE_PREFIX repository variable
  # to publish under a different owner (or a mirror on forks).
  IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX || format('ghcr.io/{0}', github.repository_owner) }}

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: notploy
            file: ./Dockerfile.cloud
            description: Notploy dashboard + server (single image)
          - image: notploy-server
            file: ./Dockerfile.server
            description: Notploy agent/server
          - image: notploy-schedules
            file: ./Dockerfile.schedule
            description: Schedule worker
          - image: notploy-monitoring
            file: ./Dockerfile.monitoring
            description: Monitoring service (Go)
          - image: notploy-mcp
            file: ./packages/mcp/Dockerfile
            description: Model Context Protocol server
          - image: notploy-docs
            file: ./web/Dockerfile.docs
            description: Documentation site
          - image: notploy-website
            file: ./web/Dockerfile.website
            description: Marketing website
    outputs:
      enabled: ${{ steps.select.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
        with:
          # cosign (keyless signing) needs the full tag history to resolve the
          # commit that an image was built from.
          fetch-depth: 0

      - name: Select requested image
        id: select
        env:
          # Read through env so the shell compares plain values instead of
          # interpolating them into the script body.
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ inputs.image }}
          CANDIDATE: ${{ matrix.image }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] \
            && [ "$REQUESTED" != "all" ] \
            && [ "$REQUESTED" != "$CANDIDATE" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping $CANDIDATE: dispatch requested '$REQUESTED'"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive tags
        id: meta
        if: steps.select.outputs.enabled == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch,branch=master
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=skygenesisenterprise

      - uses: docker/setup-buildx-action@v4
        if: steps.select.outputs.enabled == 'true'

      - name: Log in to ${{ env.IMAGE_PREFIX }}
        # Pull requests only build; forks do not get the registry token.
        if: steps.select.outputs.enabled == 'true' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_PREFIX }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute push flag
        id: flags
        if: steps.select.outputs.enabled == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.push }}" != "true" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.image }}
        id: build
        if: steps.select.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.flags.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

      - name: Install cosign
        if: steps.select.outputs.enabled == 'true' && steps.flags.outputs.push == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: steps.select.outputs.enabled == 'true' && steps.flags.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Signing every tag would burn a Fulcio/OIDC certificate per tag; the
          # digest is what consumers actually pin to, so sign that once.
          cosign sign --yes \
            "${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${DIGEST}"

  # ---------------------------------------------------------------------------
  # Tag a release so `v*` pushes have a matching GitHub Release with the image
  # digests, and so dependabot/renovate can track the published images.
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Notploy ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## Container images

            All images are multi-architecture (`linux/amd64`, `linux/arm64`),
            published to `${{ env.IMAGE_PREFIX }}` and signed with cosign
            (keyless, Fulcio/OIDC).

            | Image | Description |
            | --- | --- |
            | `notploy` | Notploy dashboard + server (single image) |
            | `notploy-server` | Notploy agent/server |
            | `notploy-schedules` | Schedule worker |
            | `notploy-monitoring` | Monitoring service (Go) |
            | `notploy-mcp` | Model Context Protocol server |
            | `notploy-docs` | Documentation site |
            | `notploy-website` | Marketing website |

            ```bash
            docker pull ${{ env.IMAGE_PREFIX }}/notploy:${{ github.ref_name }}
            ```

            Verify a signature with:

            ```bash
            cosign verify ${{ env.IMAGE_PREFIX }}/notploy@<digest> \
              --certificate-identity-regexp 'https://github.com/skygenesisenterprise/notploy/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```
