name: Docker Publish

# Publishes the product container images to the GitHub Container Registry.
#
#   GitHub Actions -> Buildx -> GHCR -> cosign (keyless)
#
# Publishing is tag-only. Each package has its own `v<major>.<minor>.<patch>`
# tag suffix (for example, `v1.2.3-cloud` publishes only `notploy-cloud`).
#
# The seven entries of the publish matrix below are the whole catalog: adding
# an image means adding it there and adding its suffix to the tag filters above.
# The build context is always the repository root because the whole monorepo
# is a single pnpm workspace.
#
# Pull requests do not run this workflow at all: ci.yml's `docker` job already
# builds the images (amd64, no push) so a pull request stays fast and this job
# can hold `packages: write` without ever being reachable from a fork. That is
# also why the permissions below are granted to the job rather than to the
# workflow.
on:
  push:
    tags:
      - "v*.*.*-app"
      - "v*.*.*-cloud"
      - "v*.*.*-mcp"
      - "v*.*.*-github"
      - "v*.*.*-website"
      - "v*.*.*-docs"
      - "v*.*.*-templates"

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # ghcr.io/<owner>/<image>. Override with the IMAGE_PREFIX repository variable
  # to publish under a different owner (or a mirror on forks).
  IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX || format('ghcr.io/{0}', github.repository_owner) }}

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing mints a short-lived OIDC token to Fulcio; without
      # this the sign step fails with "no OIDC token found".
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # `notploy` is the self-hosted image: on top of the dashboard and the
          # server it ships the build tooling a customer's deployments need
          # (Docker daemon, nixpacks, railpack, pack). `notploy-cloud` is the
          # managed one, the same application without that tooling.
          - image: notploy
            file: ./Dockerfile
            target: selfhosted
            tag_suffix: "-app"
            description: Notploy self-hosted (dashboard, server and build tooling)
          - image: notploy-cloud
            file: ./Dockerfile
            target: cloud
            tag_suffix: "-cloud"
            description: Notploy Cloud (dashboard + server)
          - image: notploy-mcp
            file: ./packages/mcp/Dockerfile
            tag_suffix: "-mcp"
            description: Notploy MCP server
          - image: notploy-github
            file: ./packages/github/Dockerfile
            tag_suffix: "-github"
            description: Notploy GitHub integration
          - image: notploy-website
            file: ./web/Dockerfile.website
            # Next.js currently crashes with SIGILL when its build worker runs
            # under QEMU for arm64; publish this site image as amd64 only.
            platforms: linux/amd64
            tag_suffix: "-website"
            description: Notploy official website
          - image: notploy-docs
            file: ./web/Dockerfile.docs
            tag_suffix: "-docs"
            description: Notploy documentation
          - image: notploy-templates
            file: ./templates/Dockerfile
            tag_suffix: "-templates"
            description: Notploy templates gallery
    steps:
      - uses: actions/checkout@v6
        with:
          # cosign (keyless signing) needs the full tag history to resolve the
          # commit that an image was built from.
          fetch-depth: 0

      - name: Select image for tag
        id: select
        env:
          TAG_NAME: ${{ github.ref_name }}
          IMAGE: ${{ matrix.image }}
          TAG_SUFFIX: ${{ matrix.tag_suffix }}
          DOCKERFILE: ${{ matrix.file }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-(app|cloud|mcp|github|website|docs|templates)$ ]]; then
            echo "::error::Unsupported Docker image tag: $TAG_NAME"
            exit 1
          fi
          version="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          variant="${BASH_REMATCH[4]}"
          if [ "$variant" != "${TAG_SUFFIX#-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skipping $IMAGE: tag $TAG_NAME publishes '$variant'"
            exit 0
          fi

          # An image can be listed before its Dockerfile lands; it is then
          # reported and left out instead of failing the whole matrix.
          if [ ! -f "$DOCKERFILE" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skipping $IMAGE: '$DOCKERFILE' does not exist yet"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Derive tags
        id: meta
        if: steps.select.outputs.enabled == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{major}}.{{minor}}.{{patch}},prefix=v,suffix=${{ matrix.tag_suffix }},value=${{ steps.select.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},prefix=v,suffix=${{ matrix.tag_suffix }},value=${{ steps.select.outputs.version }}
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=skygenesisenterprise
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: docker/setup-buildx-action@v4
        if: steps.select.outputs.enabled == 'true'

      - name: Log in to ${{ env.IMAGE_PREFIX }}
        if: steps.select.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_PREFIX }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        id: build
        if: steps.select.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

      - name: Install cosign
        if: steps.select.outputs.enabled == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: steps.select.outputs.enabled == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Signing every tag would burn a Fulcio/OIDC certificate per tag; the
          # digest is what consumers actually pin to, so sign that once.
          cosign sign --yes \
            "${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${DIGEST}"

      - name: Upload image metadata
        if: steps.select.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: image-metadata-${{ matrix.image }}
          path: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta.outputs.labels }}
          if-no-files-found: ignore
          retention-days: 30
