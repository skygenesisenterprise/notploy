name: Docs

# Keeps the MDX documentation synchronized with the implementation.
#
# Checks are split so a documentation-only pull request stays cheap:
#   changes -> detects whether the API surface changed
#   check   -> docs:check (changed-file mode on PRs, full validation otherwise),
#              coverage, unit tests and a "generated files are committed" gate
#   openapi -> regenerates openapi.json from the tRPC router when API code changed
#   build   -> builds the documentation site
#
# CI never pushes to the branch. Stale generated files fail the check job with
# the files listed so the contributor can run `pnpm docs:generate` locally.

on:
  push:
    branches:
      - master
    paths:
      - "web/apps/docs/**"
      - "openapi.json"
      - "apps/notploy/server/api/**"
      - "apps/notploy/scripts/generate-openapi.ts"
      - "packages/cli/**"
      - "packages/server/src/templates/**"
      - "templates/blueprints/**"
      - "scripts/docs/**"
      - "docs-sync.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "web/apps/docs/**"
      - "openapi.json"
      - "apps/notploy/server/api/**"
      - "apps/notploy/scripts/generate-openapi.ts"
      - "packages/cli/**"
      - "packages/server/src/templates/**"
      - "templates/blueprints/**"
      - "scripts/docs/**"
      - "docs-sync.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24.4.0"
  PNPM_VERSION: "10.22.0"

jobs:
  changes:
    name: Detect API changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changes to the API surface
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if git diff --name-only FETCH_HEAD HEAD | grep -qE '^(openapi\.json|apps/notploy/server/api/|apps/notploy/scripts/generate-openapi\.ts)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Check documentation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install documentation, CLI and tooling dependencies
        run: pnpm install --frozen-lockfile --filter=notploy --filter "@notploy/docs..." --filter "@notploy/cli..."

      - name: Check documentation consistency
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm docs:check --changed --base "$BASE_SHA"
          else
            pnpm docs:check
          fi

      - name: Report documentation coverage (advisory)
        run: pnpm docs:check:coverage

      - name: Run documentation tooling tests
        run: pnpm docs:test

      - name: Verify generated files are committed
        run: |
          set -euo pipefail
          pnpm docs:generate
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::Generated documentation is stale. Run 'pnpm docs:generate' and commit the result."
            git status --short
            git --no-pager diff
            exit 1
          fi

  openapi:
    name: Verify OpenAPI freshness
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile --filter "@notploy/app..."

      - name: Regenerate the spec from the tRPC router
        env:
          # The generator only needs import-time defaults; no .env is present in CI.
          DOTENV_CONFIG_PATH: /dev/null
        run: pnpm --filter @notploy/app run generate:openapi

      - name: Verify the committed spec is current
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- openapi.json; then
            echo "::error::openapi.json is stale. Run 'pnpm generate:openapi' and commit the result."
            exit 1
          fi

  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install documentation dependencies
        run: pnpm install --frozen-lockfile --filter=notploy --filter "@notploy/docs..."

      - name: Build the documentation site
        env:
          NEXT_OUTPUT: export
        run: pnpm docs:build
