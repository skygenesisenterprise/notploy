name: Release

# Changesets-driven versioning and publishing.
#
#   1. Every push to master runs `changesets/action`, which opens or updates the
#      "Version Packages" pull request from the pending changesets in .changeset/.
#   2. Merging that pull request consumes the changesets, so the next run finds
#      no pending changesets and the `publish` job takes over: bumped packages go
#      to npm and a GitHub Release is created.
#
# See .changeset/README.md for the developer-facing workflow.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - ".changeset/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24.4.0"
  PNPM_VERSION: "10.22.0"

jobs:
  version:
    name: Version packages
    # Only the default branch maintains the release pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v6
        with:
          # changesets/action reads the commit history to build changelog links.
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@^11.5.1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update the release pull request
        id: changesets
        uses: changesets/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: pnpm changeset version
          publish: pnpm --filter=@notploy/server --filter=@notploy/cli --filter=@notploy/sdk --filter=@notploy/mcp run build && pnpm changeset publish
          commit: "chore: version packages"
          title: "Version Packages"
          branch: changesets/release-master
          createGithubReleases: false

  release:
    name: Create GitHub Release
    needs: version
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          # The tag is the version of the highest-priority package that was just
          # published, so the UI, the CLI, the SDK and the images all line up on
          # a single tag.
          version="$(node -p "require('./packages/cli/package.json').version")"
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Notploy ${{ steps.tag.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: false
