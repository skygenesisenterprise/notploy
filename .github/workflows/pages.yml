name: Pages

# Publishes the two static sites from compiled artifacts only. The raw source
# is never published: the repository contains Astro examples under examples/,
# so a branch-based build of `master` (Jekyll) fails. Each site is built, its
# output directory is validated, a CNAME is written for its domain, and only
# then is the result pushed to the gh-pages branch of its publishing target.
#
#   website       -> external repository (WEBSITE_PAGES_REPOSITORY)
#                    gh-pages -> https://notploy.com
#   documentation -> this repository
#                    gh-pages -> https://docs.notploy.com
#
# GitHub Pages allows one custom domain per repository, which is why the two
# sites need two distinct publishing targets. The jobs are independent: a
# failure of one does not block the other.
#
# The documentation is a Next.js static export, which does not support
# next.config redirects(). The docs app therefore ships a root page that
# redirects to /docs/core/ (the standalone server redirect still applies in
# Docker), and `pnpm docs:build` materialises the legacy URL redirects as
# static meta-refresh stubs under out/ before this workflow validates them.
#
# Each deployment job runs inside its own GitHub environment, so protection
# rules (required reviewers, wait timers, deployment branches) and
# environment-scoped variables and secrets apply to that site only. A value
# defined on the environment takes precedence over a repository-level value
# with the same name, which keeps the two sites isolated.
#
#   environment `website`
#     variable WEBSITE_PAGES_REPOSITORY    required, external Pages repository,
#                                          format `owner/repo`
#                                          (organisation/depot), must be a
#                                          different repository than this one
#     secret   PAGES_DEPLOY_TOKEN          required, token with contents:write
#                                          AND pages:read/write on
#                                          WEBSITE_PAGES_REPOSITORY.
#                                          Fine-grained PAT: repository access
#                                          limited to that repository with
#                                          "Contents: Read and write" and
#                                          "Pages: Read and write" (the Pages
#                                          permission is what lets the
#                                          post-deploy step read and repair
#                                          the Pages settings; without it the
#                                          job fails naming the missing
#                                          permission instead of pretending
#                                          the publication was verified).
#                                          Classic PAT: `repo` scope for a
#                                          private target repository.
#                                          Never print its value.
#     variable CONTACT_FORM_ENDPOINT       optional, external contact form endpoint
#     variable GHOST_URL                   required in practice for the static
#                                          build: the blog routes fail the
#                                          export when the Ghost Content API is
#                                          unreachable (the CMS that feeds
#                                          /blog and /blog/tag/*)
#     secret   GHOST_KEY                   required in practice, Content API key
#                                          for GHOST_URL (26 hex characters)
#     variable NEXT_PUBLIC_APP_URL         optional, canonical site URL
#     variable NEXT_PUBLIC_NOTPLOY_TRAFFIC_KEY       optional, Traffic Manager property key
#     variable NEXT_PUBLIC_NOTPLOY_TRAFFIC_ENDPOINT  optional, Traffic Manager collector origin
#
#   environment `documentation`
#     no required configuration: the job pushes to this repository with the
#     workflow GITHUB_TOKEN (permissions contents: write + pages: write, no
#     personal secret). The pages permission lets the same token verify and
#     repair this repository's Pages settings after the publish.
#     variable NEXT_PUBLIC_NOTPLOY_TRAFFIC_KEY       optional, Traffic Manager property key
#     variable NEXT_PUBLIC_NOTPLOY_TRAFFIC_ENDPOINT  optional, Traffic Manager collector origin
#
# After each publish, both jobs run .github/scripts/ensure-github-pages.mjs
# against their own publishing target. It verifies the publication parameters
# and repairs what the available permissions allow, idempotently (a write
# request is only sent when the current state differs from the expected one):
#   - GitHub Pages disabled       -> enable it with source branch gh-pages
#   - wrong source branch/build   -> switch back to "Deploy from a branch",
#                                    gh-pages, folder "/ (root)"
#   - Enforce HTTPS off           -> turn it on; a refusal (certificate still
#                                    pending) is only a warning
#   - custom domain not recorded  -> warning only: the domain is bound through
#                                    the CNAME file published in gh-pages and
#                                    through Settings -> Pages. DNS records
#                                    and organisation domain verification are
#                                    external, are never modified here, and
#                                    cannot be automated from a workflow.
# The step runs after the push so the gh-pages branch already exists the first
# time Pages has to be enabled. Each job keeps its own result: a failure of one
# never blocks the other.
#
# Required setup (repository settings, not code):
#   This repository: Settings -> Pages -> Source "Deploy from a branch",
#     branch `gh-pages`, folder `/ (root)` (the workflow repairs this
#     automatically when the token allows it; otherwise the failure message
#     names the exact setting).
#   Website repository: Settings -> Pages -> Source "Deploy from a branch",
#     branch `gh-pages`, folder `/ (root)` (same automatic repair through
#     PAGES_DEPLOY_TOKEN).
#   Do not point any of these Pages settings at `master`: the source tree is
#   not a static site.
#   Custom domains: `notploy.com` on the website repository,
#   `docs.notploy.com` on this repository. The CNAME files are written by the
#   workflow into the published artifacts; the DNS records (already pointing
#   both hostnames at GitHub Pages) and, for an organisation repository, the
#   domain verification under organisation Settings -> Domains stay manual
#   and are outside the scope of this workflow.

on:
  push:
    branches:
      - master
    paths:
      - "web/apps/website/**"
      - "web/apps/docs/**"
      - "scripts/docs/**"
      - "apps/notploy/server/api/**"
      - "apps/notploy/scripts/generate-openapi.ts"
      - "packages/cli/**"
      - "packages/server/src/templates/**"
      - "templates/blueprints/**"
      - "openapi.json"
      - "docs-sync.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
      - ".github/scripts/ensure-github-pages.mjs"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24.4.0"
  PNPM_VERSION: "10.22.0"

jobs:
  website:
    name: Deploy website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: website
      url: https://notploy.com
    permissions:
      contents: read
    steps:
      - name: Verify website deployment configuration
        env:
          REPOSITORY: ${{ vars.WEBSITE_PAGES_REPOSITORY }}
          TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          THIS_REPOSITORY: ${{ github.repository }}
          GHOST_URL: ${{ vars.GHOST_URL }}
          GHOST_KEY: ${{ secrets.GHOST_KEY }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # Configuration errors: reported before anything is built so they
          # cannot be confused with a build or publish failure.
          if [ -z "$REPOSITORY" ]; then
            fail "Set WEBSITE_PAGES_REPOSITORY on the 'website' environment to the Pages repository (owner/repo)."
          fi
          if [ -z "$TOKEN" ]; then
            fail "Set PAGES_DEPLOY_TOKEN on the 'website' environment (contents:write on the Pages repository)."
          fi
          if ! printf '%s' "$REPOSITORY" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'; then
            fail "WEBSITE_PAGES_REPOSITORY ('$REPOSITORY') is not in the required 'owner/repo' format."
          fi
          if [ "$REPOSITORY" = "$THIS_REPOSITORY" ]; then
            fail "WEBSITE_PAGES_REPOSITORY must not be $THIS_REPOSITORY: that repository already publishes the documentation, and GitHub Pages allows only one custom domain per repository."
          fi

          # Target repository check: distinguishes a missing repository or an
          # unusable token from a build failure. The token value is never
          # printed, only HTTP status codes.
          status=$(curl -sS -o /tmp/pages-repo.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY") || \
            fail "Could not reach the GitHub API for $REPOSITORY."
          case "$status" in
            200) ;;
            401) fail "PAGES_DEPLOY_TOKEN was rejected by the GitHub API (HTTP 401). Check the token value and its expiration." ;;
            403) fail "PAGES_DEPLOY_TOKEN is not allowed on $REPOSITORY (HTTP 403). Grant it contents:write on that repository." ;;
            404) fail "Target repository $REPOSITORY does not exist, or PAGES_DEPLOY_TOKEN cannot see it (HTTP 404)." ;;
            *)   fail "Unexpected HTTP $status while reading $REPOSITORY with PAGES_DEPLOY_TOKEN." ;;
          esac

          # The Pages settings themselves are verified and repaired after the
          # publish by .github/scripts/ensure-github-pages.mjs: that step runs
          # once the gh-pages branch exists, so Pages can also be enabled on
          # the very first deployment. Only credentials and the target
          # repository are checked here, before anything is built.

          # Ghost Content API configuration: presence only, values are never
          # printed. An unset value does not fail here because the static
          # export itself reports an actionable error when the blog routes
          # cannot be generated.
          if [ -z "$GHOST_URL" ]; then
            echo "::warning::GHOST_URL is not set on the 'website' environment; the static export fetches /blog from the Ghost Content API and fails the build when the CMS is unreachable."
          fi
          if [ -z "$GHOST_KEY" ]; then
            echo "::warning::GHOST_KEY is not set on the 'website' environment (secret: Content API key for GHOST_URL)."
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install website dependencies
        run: pnpm install --frozen-lockfile --filter "@notploy/website..."

      - name: Build static website
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.CONTACT_FORM_ENDPOINT }}
          NEXT_PUBLIC_NOTPLOY_TRAFFIC_ENDPOINT: ${{ vars.NEXT_PUBLIC_NOTPLOY_TRAFFIC_ENDPOINT }}
          NEXT_PUBLIC_NOTPLOY_TRAFFIC_KEY: ${{ vars.NEXT_PUBLIC_NOTPLOY_TRAFFIC_KEY }}
          GHOST_URL: ${{ vars.GHOST_URL }}
          GHOST_KEY: ${{ secrets.GHOST_KEY }}
        run: pnpm --filter @notploy/website run build:static

      - name: Validate static website output and write CNAME
        env:
          DOMAIN: notploy.com
        run: |
          set -euo pipefail
          dir=web/apps/website/out
          if [ ! -d "$dir" ]; then
            echo "::error::Static export '$dir' was not produced by the website build."
            exit 1
          fi
          if [ ! -f "$dir/index.html" ]; then
            echo "::error::'$dir' has no index.html; the website static export is incomplete."
            exit 1
          fi
          printf '%s\n' "$DOMAIN" > "$dir/CNAME"
          if [ "$(cat "$dir/CNAME")" != "$DOMAIN" ]; then
            echo "::error::The generated CNAME does not contain exactly '$DOMAIN'."
            exit 1
          fi
          echo "Static website output validated ($(find "$dir" -type f | wc -l) files), CNAME=$DOMAIN."

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          external_repository: ${{ vars.WEBSITE_PAGES_REPOSITORY }}
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./web/apps/website/out
          cname: notploy.com
          force_orphan: true
          user_name: notploy-bot
          user_email: bot@notploy.com

      - name: Verify GitHub Pages publication settings
        env:
          PAGES_REPOSITORY: ${{ vars.WEBSITE_PAGES_REPOSITORY }}
          PAGES_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          PAGES_EXPECTED_CNAME: notploy.com
          PAGES_DOMAIN: https://notploy.com
        run: node .github/scripts/ensure-github-pages.mjs

  documentation:
    name: Deploy documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: documentation
      url: https://docs.notploy.com
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install documentation dependencies
        run: pnpm install --frozen-lockfile --filter=notploy --filter "@notploy/docs..."

      - name: Build static documentation
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_NOTPLOY_TRAFFIC_ENDPOINT: ${{ vars.NEXT_PUBLIC_NOTPLOY_TRAFFIC_ENDPOINT }}
          NEXT_PUBLIC_NOTPLOY_TRAFFIC_KEY: ${{ vars.NEXT_PUBLIC_NOTPLOY_TRAFFIC_KEY }}
        run: pnpm docs:build

      - name: Validate static documentation output and write CNAME
        env:
          DOMAIN: docs.notploy.com
        run: |
          set -euo pipefail
          dir=web/apps/docs/out
          if [ ! -d "$dir" ]; then
            echo "::error::Static export '$dir' was not produced by the documentation build."
            exit 1
          fi
          # The export must serve a useful site, not just a directory tree:
          #   index.html            root page (redirects to /docs/core/,
          #                         replaces the next.config redirect that
          #                         `output: "export"` does not support)
          #   docs/index.html       documentation home
          #   docs/core/index.html  entry point and redirect destination
          for required in index.html docs/index.html docs/core/index.html; do
            if [ ! -f "$dir/$required" ]; then
              echo "::error::'$dir/$required' is missing; the documentation static export is incomplete."
              exit 1
            fi
          done
          if ! grep -q 'url=/docs/core/' "$dir/index.html"; then
            echo "::error::'$dir/index.html' does not redirect to /docs/core/; visitors reaching https://docs.notploy.com/ would see a broken page."
            exit 1
          fi
          printf '%s\n' "$DOMAIN" > "$dir/CNAME"
          if [ "$(cat "$dir/CNAME")" != "$DOMAIN" ]; then
            echo "::error::The generated CNAME does not contain exactly '$DOMAIN'."
            exit 1
          fi
          echo "Static documentation output validated ($(find "$dir" -type f | wc -l) files), CNAME=$DOMAIN."

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./web/apps/docs/out
          cname: docs.notploy.com
          force_orphan: true
          user_name: notploy-bot
          user_email: bot@notploy.com

      - name: Verify GitHub Pages publication settings
        env:
          PAGES_REPOSITORY: ${{ github.repository }}
          PAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_EXPECTED_CNAME: docs.notploy.com
          PAGES_DOMAIN: https://docs.notploy.com
        run: node .github/scripts/ensure-github-pages.mjs
