name: Node Release

on:
  push:
    tags:
      - "v*.*.*-cli"
      - "v*.*.*-sdk"
      - "v*.*.*-trpc-openapi"
      - "v*.*.*-node"
  workflow_dispatch:

concurrency:
  group: node-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24.4.0"
  PNPM_VERSION: "10.22.0"
  NPMJS_REGISTRY: https://registry.npmjs.org

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select packages from trigger
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF" != "refs/heads/master" ]]; then
              echo "::error::Manual releases can only be run from master"
              exit 1
            fi
            suffix=node
          else
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(cli|sdk|trpc-openapi|node)$ ]]; then
              echo "::error::Unsupported release tag: $RELEASE_TAG"
              exit 1
            fi
            suffix="${BASH_REMATCH[1]}"
          fi

          case "$suffix" in
            cli)
              # CLI patch releases (`vX.Y.Z-cli`) go to npmjs only.
              matrix="$(jq -cn '{include:[{package:"@notploy/cli",dir:"packages/cli"}]}')"
              ;;
            sdk)
              matrix="$(jq -cn '{include:[{package:"@notploy/sdk",dir:"packages/sdk"}]}')"
              ;;
            trpc-openapi)
              matrix="$(jq -cn '{include:[{package:"@notploy/trpc-openapi",dir:"packages/trpc-openapi"}]}')"
              ;;
            node)
              matrix="$(jq -cn '{include:[{package:"@notploy/cli",dir:"packages/cli"},{package:"@notploy/sdk",dir:"packages/sdk"},{package:"@notploy/trpc-openapi",dir:"packages/trpc-openapi"}]}')"
              ;;
          esac

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.package }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: ${{ env.NPMJS_REGISTRY }}

      - name: Enable npm trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Pin the @notploy scope to npmjs
        env:
          NPMJS_REGISTRY: ${{ env.NPMJS_REGISTRY }}
        run: |
          set -euo pipefail

          # `npm publish --registry` changes only the default registry: a scoped
          # `@notploy:registry` entry takes precedence. Pin the scope explicitly
          # so a CLI patch cannot be redirected to GitHub Packages by an
          # inherited npm configuration.
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          registry="${NPMJS_REGISTRY%/}"
          touch "$npmrc"
          if grep -q '^@notploy:registry=' "$npmrc"; then
            sed -i "s|^@notploy:registry=.*|@notploy:registry=${registry}/|" "$npmrc"
          else
            printf '\n@notploy:registry=%s/\n' "$registry" >> "$npmrc"
          fi

      - name: Install dependencies
        env:
          PACKAGE: ${{ matrix.package }}
        run: pnpm install --frozen-lockfile --filter "$PACKAGE..."

      - name: Build package
        id: build
        env:
          PACKAGE: ${{ matrix.package }}
        run: pnpm --filter "$PACKAGE" run build

      - name: Resolve release version
        id: release
        env:
          PACKAGE_DIR: ${{ matrix.dir }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./$PACKAGE_DIR/package.json').version")"
          if [[ "$EVENT_NAME" != "workflow_dispatch" && "$RELEASE_TAG" != *-node ]]; then
            tag_version="${RELEASE_TAG#v}"
            package_suffix="${PACKAGE_DIR##*/}"
            tag_version="${tag_version%-${package_suffix}}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "::error::Tag $RELEASE_TAG does not match $PACKAGE_DIR version $version"
              exit 1
            fi
          fi

          case "$version" in
            *-*) dist_tag="${version##*-}" ;;
            *) dist_tag=latest ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $PACKAGE_DIR@$version"

      - name: Pack package
        id: pack
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail

          pack_dir="${RUNNER_TEMP}/pack"
          mkdir -p "$pack_dir"
          pnpm --filter "$PACKAGE" pack --pack-destination "$pack_dir"

          tarball="$(find "$pack_dir" -name '*.tgz' -print -quit)"
          if [[ -z "$tarball" ]]; then
            echo "::error::pnpm pack produced no tarball for $PACKAGE"
            exit 1
          fi

          artifact_name="${PACKAGE#@}"
          artifact_name="${artifact_name//\//-}"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "Contents of $(basename "$tarball"):"
          tar -tzf "$tarball" | sed 's/^/  /'

      - name: Publish to npmjs
        id: publish-npmjs
        if: steps.release.outcome == 'success' && steps.pack.outcome == 'success'
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::Repository secret NPM_TOKEN is required to publish to npmjs"
            exit 1
          fi

          if lookup="$(npm view "$PACKAGE@$VERSION" version --registry "$NPMJS_REGISTRY" --prefer-online 2>&1)"; then
            echo "::notice::$PACKAGE@$VERSION is already on npmjs"
            exit 0
          elif [[ "$lookup" == *E404* || "$lookup" == *"404 Not Found"* || "$lookup" == *"Not Found - GET"* ]]; then
            echo "::notice::$PACKAGE@$VERSION is not on npmjs yet"
          else
            echo "$lookup"
            echo "::error::Could not check whether $PACKAGE@$VERSION exists on npmjs"
            exit 1
          fi

          publish_status=0
          if npm publish "$TARBALL" \
            --registry "$NPMJS_REGISTRY" \
            --access public \
            --tag "$DIST_TAG"; then
            publish_status=0
          else
            publish_status=$?
          fi

          # Verify the exact version on npmjs, not just the exit status of
          # `npm publish`. npm accepts a publish before the version is served
          # by the registry ("being processed and may take a few minutes"), so
          # poll for a bounded time instead of failing on the first lookup.
          published=false
          for attempt in $(seq 1 30); do
            if npm view "$PACKAGE@$VERSION" version \
              --registry "$NPMJS_REGISTRY" \
              --prefer-online > /dev/null 2>&1; then
              published=true
              break
            fi
            if [[ "$attempt" -lt 30 ]]; then
              echo "Waiting for npmjs to serve $PACKAGE@$VERSION (attempt $attempt/30)..."
              sleep 10
            fi
          done

          if [[ "$published" == "true" ]]; then
            if [[ "$publish_status" -eq 0 ]]; then
              echo "::notice::$PACKAGE@$VERSION is published on npmjs"
            else
              echo "::notice::$PACKAGE@$VERSION is now on npmjs; treating the publish as already completed"
            fi
            exit 0
          fi

          if [[ "$publish_status" -eq 0 ]]; then
            echo "::error::$PACKAGE@$VERSION was not found on npmjs after a successful publish (waited up to 5 minutes)"
            exit 1
          fi

          exit "$publish_status"

      - name: Upload package tarball
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.artifact-name }}-${{ steps.release.outputs.version }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 90

      - name: Summarize publication
        if: always()
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ steps.release.outputs.version }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          PACK_OUTCOME: ${{ steps.pack.outcome }}
          NPMJS_OUTCOME: ${{ steps.publish-npmjs.outcome }}
        run: |
          result_for() {
            case "$1" in
              success) printf 'success (published or already present)' ;;
              failure) printf 'failed' ;;
              skipped) printf 'skipped' ;;
              cancelled) printf 'cancelled' ;;
              *) printf 'not run' ;;
            esac
          }

          {
            echo "### $PACKAGE@${VERSION:-unresolved}"
            echo
            echo "| Registry | Result |"
            echo "| --- | --- |"
            echo "| Build | $(result_for "$BUILD_OUTCOME") |"
            echo "| Version resolution | $(result_for "$RELEASE_OUTCOME") |"
            echo "| Pack | $(result_for "$PACK_OUTCOME") |"
            echo "| npmjs | $(result_for "$NPMJS_OUTCOME") |"
          } >> "$GITHUB_STEP_SUMMARY"
