name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24.4.0"
  PNPM_VERSION: "10.22.0"
  TURBO_CACHE_DIR: .turbo

jobs:
  # ---------------------------------------------------------------------------
  # Lint / format — advisory.
  #
  # The repository was reformatted onto Biome during the monorepo unification but
  # the pre-existing violations were never paid down (773 errors in
  # apps/notploy, 16 in web). The job is wired up and reports, but it must not
  # block every PR on day one. Flip `continue-on-error` to `false` once the
  # backlog is cleared.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: apps/notploy
          - dir: packages/cli
          - dir: packages/mcp
          - dir: packages/sdk
          - dir: web
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        working-directory: ${{ matrix.dir }}
        run: pnpm exec biome check --reporter=github .

  # ---------------------------------------------------------------------------
  # Type check — advisory, same rationale as `lint`. Every package currently has
  # pre-existing errors (`PageProps`/`RouteContext` globals missing in docs,
  # `@dokploy/server/*` leftovers in packages/server, RHF generics in the app).
  # ---------------------------------------------------------------------------
  typecheck:
    name: Typecheck (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: apps/notploy
            script: typecheck
          - dir: packages/server
            script: typecheck
          - dir: web/apps/website
            script: typecheck
          - dir: web/apps/docs
            script: types:check
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: ${{ matrix.dir }}
        run: pnpm run ${{ matrix.script }}

  # ---------------------------------------------------------------------------
  # Unit tests — hard gate.
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: apps/notploy
            command: exec vitest run --config __test__/vitest.config.ts
          - dir: packages/cli
            command: run test
          - dir: packages/mcp
            command: run test
          - dir: packages/sdk
            command: run test
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # The CLI/SDK/MCP test suites import from their own `dist`/`build`
      # output, so those packages have to be compiled first.
      - name: Build packages under test
        run: pnpm --filter=@notploy/sdk --filter=@notploy/mcp --filter=@notploy/cli run build

      - name: Run tests
        working-directory: ${{ matrix.dir }}
        run: pnpm ${{ matrix.command }}

  # ---------------------------------------------------------------------------
  # Build — hard gate. Each entry installs the whole workspace (single shared
  # pnpm-lock.yaml) and builds one target, so failures are easy to attribute.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: server
            filters: --filter=@notploy/server
          - target: app
            filters: --filter=@notploy/app
          - target: packages
            filters: --filter=@notploy/cli --filter=@notploy/sdk --filter=@notploy/mcp
          - target: docs
            filters: --filter=@notploy/docs
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # @notploy/app type-checks and builds against @notploy/server's output.
      - name: Build @notploy/server
        if: matrix.target == 'app'
        run: pnpm --filter=@notploy/server run build

      - name: Generate OpenAPI reference pages
        if: matrix.target == 'docs'
        run: pnpm --filter=@notploy/docs run build:docs

      - name: Build
        run: pnpm ${{ matrix.filters }} run build

  # ---------------------------------------------------------------------------
  # Container build check — hard gate on the two images that carry the product.
  # Builds only (no push, amd64 only) so PRs stay fast; the multi-arch push
  # happens in docker-publish.yml.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: notploy
            file: ./Dockerfile.cloud
          - image: notploy-docs
            file: ./web/Dockerfile.docs
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

  # ---------------------------------------------------------------------------
  # Go module (apps/monitoring) — hard gate, separate toolchain.
  # ---------------------------------------------------------------------------
  go:
    name: Go (apps/monitoring)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/monitoring
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/monitoring/go.mod
          cache-dependency-path: apps/monitoring/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  # ---------------------------------------------------------------------------
  # Roll-up gate: the status check required to merge.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    if: always()
    runs-on: ubuntu-latest
    needs:
      - test
      - build
      - docker
      - go
    steps:
      - name: Check required jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          GO_RESULT: ${{ needs.go.result }}
        run: |
          failed=0
          for job in test build docker go; do
            var="$(echo "$job" | tr '[:lower:]' '[:upper:]')_RESULT"
            result="${!var}"
            if [ "$result" != "success" ]; then
              echo "::error::Job '$job' finished with '$result'"
              failed=1
            else
              echo "ok: $job"
            fi
          done
          exit "$failed"
