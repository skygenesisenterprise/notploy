# Single source of truth for the whole monorepo: a single `pnpm install` at the
# root installs every package below. Do not add nested pnpm-workspace.yaml files.
packages:
  # Main applications
  - "apps/*"
  # Publishable/shared libraries
  - "packages/*"
  # Nested packages that are not covered by the globs above
  - "packages/server/src/emails"
  - "packages/sdk/example"
  # Marketing site + documentation (single install, shared toolchain)
  - "web"
  - "web/apps/*"
  # Template gallery tooling
  - "templates/app"
  - "templates/build-scripts"

# `examples/*` is intentionally NOT part of this workspace: those projects are
# deployed as-is to a Notploy instance and ship their own pnpm-lock.yaml so they
# stay reproducible standalone.

# pnpm 10.22+ no longer reads the `pnpm` field from package.json, so every
# setting below lives here instead. The `@types/react*` pins are the former
# `resolutions` entries from the root package.json.
overrides:
  "@types/react": 18.3.5
  "@types/react-dom": 18.3.0
  esbuild: 0.20.2
  better-call: 1.3.7
  "@better-fetch/fetch": 1.3.1
  tar: ">=7.5.19 <8.0.0"
  protobufjs: ">=7.5.5 <8.0.0"

peerDependencyRules:
  ignoreMissing:
    - prisma
    - "@prisma/client"
    - "@prisma/engines"
    - "@electric-sql/pglite"
    - typescript
    - drizzle-kit

# Install scripts are blocked by default in pnpm 10; these packages need theirs
# to compile/download native bindings. Must be configured at the workspace root —
# per-package `pnpm.onlyBuiltDependencies` has no effect.
onlyBuiltDependencies:
  - "@scarf/scarf"
  - "@tree-sitter-grammars/tree-sitter-yaml"
  - bcrypt
  - better-sqlite3
  - core-js-pure
  - cpu-features
  - esbuild
  - msgpackr-extract
  - node-pty
  - protobufjs
  - sharp
  - ssh2
  - tree-sitter
  - tree-sitter-json

# Supply-chain hardening: refuse package versions younger than N days,
# so newly-published malicious versions get caught/yanked before we install them.
# Disabled for now — kept breaking builds on unrelated fresh transitive deps
# (see PR #4679). Re-enable when there's a per-scope threshold or exclude list.
# minimumReleaseAge: 1440
