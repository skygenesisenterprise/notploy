packages:
  - apps/*
  - packages/*
  - web
  - web/apps/*
  - templates/app
  - templates/build-scripts

allowBuilds:
  '@scarf/scarf': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  '@vscode/vsce-sign': true
  bcrypt: true
  core-js: true
  core-js-pure: true
  cpu-features: true
  electron-winstaller: true
  esbuild: true
  free-email-domains: true
  msgpackr-extract: true
  node-pty: true
  protobufjs: true
  sharp: true
  ssh2: true
  tree-sitter: true
  tree-sitter-json: true

overrides:
  '@better-fetch/fetch': 1.3.1
  '@types/react': 18.3.5
  '@types/react-dom': 18.3.0
  better-call: 1.3.7
  esbuild: 0.20.2
  protobufjs: '>=7.5.5 <8.0.0'
  tar: '>=7.5.19 <8.0.0'

peerDependencyRules:
  ignoreMissing:
    - prisma
    - '@prisma/client'
    - '@prisma/engines'
    - '@electric-sql/pglite'
    - typescript
    - drizzle-kit

permissions:
  '@trpc/client':
    skills: [client-setup, links, superjson]
  '@trpc/next':
    skills: [nextjs-app-router, nextjs-pages-router]
  '@trpc/server':
    skills: [adapter-aws-lambda, adapter-express, adapter-fastify, adapter-fetch, adapter-standalone, auth, caching, error-handling, middlewares, non-json-content-types, server-setup, server-side-calls, service-oriented-architecture, subscriptions, trpc-router, validators]
  ai:
    skills: true
