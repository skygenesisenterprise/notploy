packages:
  - apps/*
  - packages/*
  - web
  - web/apps/*
  - templates/app
  - templates/build-scripts

allowBuilds:
  '@scarf/scarf': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  '@vscode/vsce-sign': true
  bcrypt: true
  core-js: true
  core-js-pure: true
  cpu-features: true
  electron-winstaller: true
  esbuild: true
  free-email-domains: true
  msgpackr-extract: true
  node-pty: true
  protobufjs: true
  sharp: true
  ssh2: true
  tree-sitter: true
  tree-sitter-json: true

onlyBuiltDependencies:
  - '@scarf/scarf'
  - '@tree-sitter-grammars/tree-sitter-yaml'
  - '@vscode/vsce-sign'
  - bcrypt
  - core-js
  - core-js-pure
  - cpu-features
  - electron-winstaller
  - esbuild
  - free-email-domains
  - msgpackr-extract
  - node-pty
  - protobufjs
  - sharp
  - ssh2
  - tree-sitter
  - tree-sitter-json

overrides:
  '@better-fetch/fetch': 1.3.1
  '@types/react': 18.3.5
  '@types/react-dom': 18.3.0
  better-call: 1.3.7
  esbuild: 0.20.2
  protobufjs: '>=7.5.5 <8.0.0'
  tar: '>=7.5.19 <8.0.0'

peerDependencyRules:
  ignoreMissing:
    - prisma
    - '@prisma/client'
    - '@prisma/engines'
    - '@electric-sql/pglite'
    - typescript
    - drizzle-kit
