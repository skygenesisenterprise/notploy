# Notploy — root Docker Compose stack.
#
# This is the single entry point for running Notploy from the repository root.
# It builds the root `Dockerfile` and exposes the dashboard in the browser.
#
#   docker compose up -d          # self-hosted (build + run)  -> http://localhost:3000
#   docker compose logs -f
#   docker compose down
#
# Switching flavors (all use the same Dockerfile targets):
#
#   self-hosted  docker compose up -d                                (default)
#   cloud        NOTPLOY_FLAVOR=cloud NOTPLOY_IMAGE=ghcr.io/skygenesisenterprise/notploy-cloud docker compose up -d --build
#   pinned image NOTPLOY_IMAGE=ghcr.io/skygenesisenterprise/notploy NOTPLOY_VERSION=v0.30.6 docker compose up -d
#   development  docker compose --profile dev up --watch notploy-dev  -> http://localhost:3000
#
# The `dev` service bind-mounts `apps/notploy` and `packages` from the host and
# restores the image's node_modules through anonymous volumes, so the dev
# server always runs the sources on disk (and hot-reloads them) while keeping
# the dependencies resolved from pnpm-lock.yaml.
#
# Both `notploy` and `notploy-dev` declare `depends_on: [postgres, traefik]`,
# so a single command (even a service-scoped one such as
# `docker compose --profile dev up --watch notploy-dev`) always brings up the
# whole support stack: PostgreSQL, Traefik and Notploy itself.
#
# `notploy` (production) and `notploy-dev` (development) both publish the
# dashboard on ${NOTPLOY_PORT:-3000}, so the app is always reachable at
# http://localhost:3000 whatever the mode. They are mutually exclusive: only
# one of them can own the port at a time.
#
# Or use the Makefile wrappers: `make docker-up`, `make docker-up NOTPLOY_FLAVOR=cloud`,
# `make docker-dev`.
#
# Architecture: Notploy talks to the *host* Docker Engine through the mounted
# socket — it is not Docker-in-Docker. Traefik is declared natively below and
# shares the `notploy-config` volume with the app, so Notploy writes its
# Traefik/dynamic config where the Compose-managed Traefik can read it even when
# Notploy itself runs in a container (NOTPLOY_CONFIG_PATH points there).

name: notploy

services:
  # -------------------------------------------------------------------------
  # PostgreSQL 16 — the database Notploy stores its state in.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notploy}
      POSTGRES_DB: ${POSTGRES_DB:-notploy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notploy}
    volumes:
      - notploy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-notploy} -d ${POSTGRES_DB:-notploy}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - notploy

  # -------------------------------------------------------------------------
  # Traefik — the edge router for every deployed application. Declared here so
  # Compose creates it alongside Notploy (like `postgres`), instead of the app
  # creating its own container on demand: bind sources created from inside a
  # container resolve on the host and would not exist there. It reads its static
  # config and dynamic files from the shared `notploy-config` volume.
  # -------------------------------------------------------------------------
  traefik:
    image: traefik:v${TRAEFIK_VERSION:-3.6.25}
    container_name: notploy-traefik
    restart: unless-stopped
    command:
      - --configFile=/etc/notploy/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # Traefik dashboard/API (api.insecure is enabled in the generated config).
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - notploy-config:/etc/notploy
    networks:
      - notploy

  # -------------------------------------------------------------------------
  # Notploy — the application. Flavor is selected by NOTPLOY_FLAVOR
  # (selfhosted | cloud), which maps to a Dockerfile target.
  # -------------------------------------------------------------------------
  notploy:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${NOTPLOY_FLAVOR:-selfhosted}
    image: ${NOTPLOY_IMAGE:-ghcr.io/skygenesisenterprise/notploy}:${NOTPLOY_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Same support stack in production and in development: the Compose-managed
      # Traefik is always started, never left to be created on demand by the app.
      traefik:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # Internal service name — never localhost from inside the container.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgres://${POSTGRES_USER:-notploy}:${POSTGRES_PASSWORD:-notploy}@postgres:5432/${POSTGRES_DB:-notploy}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-notploy-insecure-default-change-me}
      # Cloud flavor (FLAVOR=cloud / NOTPLOY_FLAVOR=cloud) sets this to true.
      IS_CLOUD: ${IS_CLOUD:-false}
      TZ: ${TZ:-UTC}
      # Internal DNS: serves the Notploy Internal DNS zones (e.g.
      # gitlab.notploy.lan) to the LAN and forwards the rest upstream.
      NOTPLOY_DNS_SERVER: ${NOTPLOY_DNS_SERVER:-true}
      NOTPLOY_DNS_PORT: 53
      NOTPLOY_DNS_UPSTREAM: ${NOTPLOY_DNS_UPSTREAM:-1.1.1.1,8.8.8.8}
      # Share the Traefik config with the Compose-managed `traefik` service.
      NOTPLOY_CONFIG_PATH: /etc/notploy
    ports:
      # Host port is configurable; the container always listens on 3000.
      - "${NOTPLOY_PORT:-3000}:3000"
      # DNS for LAN clients. Point your router/DHCP DNS at this host. The host
      # side defaults to 53, so it must be free: systemd-resolved, dnsmasq or
      # Pi-hole hold it on most distros and the container then fails with
      # "listen tcp4 0.0.0.0:53: bind: address already in use". Shift the host
      # port with NOTPLOY_DNS_HOST_PORT in .env (the container always stays 53).
      - "${NOTPLOY_DNS_HOST_PORT:-53}:53/udp"
      - "${NOTPLOY_DNS_HOST_PORT:-53}:53/tcp"
    volumes:
      # Host Docker Engine access (required: Notploy deploys and manages
      # containers). Socket access, not Docker-in-Docker.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent Notploy state: Traefik config, applications, compose files,
      # SSH keys, certificates, logs.
      - notploy-config:/etc/notploy
      # Docker registry/credential state used by the deployment pipeline.
      - notploy-docker:/root/.docker
    networks:
      - notploy

  # -------------------------------------------------------------------------
  # Notploy in development mode (hot reload). Opt-in via the `dev` profile and
  # run explicitly so it never races the production service for the port:
  #   docker compose --profile dev up --watch notploy-dev
  #
  # It publishes the very same URL as `notploy` (http://localhost:3000) so the
  # dashboard behaves identically in dev and in production.
  # -------------------------------------------------------------------------
  notploy-dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: notploy-dev:local
    working_dir: /usr/src/app
    # entrypoint.sh waits for PostgreSQL, applies migrations and starts the dev
    # server (Next client + tRPC API).
    environment:
      NODE_ENV: development
      NOTPLOY_MODE: development
      PORT: 3000
      HOST: 0.0.0.0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgres://${POSTGRES_USER:-notploy}:${POSTGRES_PASSWORD:-notploy}@postgres:5432/${POSTGRES_DB:-notploy}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-notploy-insecure-default-change-me}
      # Same flavor switch as production, so `NOTPLOY_FLAVOR=cloud make docker-dev`
      # exercises the cloud code paths.
      IS_CLOUD: ${IS_CLOUD:-false}
      TZ: ${TZ:-UTC}
      # Serve templates from the bind-mounted blueprints directory instead of
      # https://templates.notploy.com, so dev never depends on that domain.
      NOTPLOY_TEMPLATES_DIR: /usr/src/app/templates/blueprints
      # Inotify works through bind mounts on Linux. On Docker Desktop
      # (macOS/Windows) set DEV_POLLING=true to use polling instead.
      CHOKIDAR_USEPOLLING: ${DEV_POLLING:-false}
      WATCHPACK_POLLING: ${DEV_POLLING:-false}
      # Internal DNS server (see the production service above).
      NOTPLOY_DNS_SERVER: ${NOTPLOY_DNS_SERVER:-true}
      NOTPLOY_DNS_PORT: 53
      NOTPLOY_DNS_UPSTREAM: ${NOTPLOY_DNS_UPSTREAM:-1.1.1.1,8.8.8.8}
      # Share the Traefik config with the Compose-managed `traefik` service.
      NOTPLOY_CONFIG_PATH: /etc/notploy
    ports:
      # Same host port as production: the app is always on
      # http://localhost:${NOTPLOY_PORT:-3000}.
      - "${NOTPLOY_PORT:-3000}:3000"
      # DNS for LAN clients (see the production service above).
      - "${NOTPLOY_DNS_HOST_PORT:-53}:53/udp"
      - "${NOTPLOY_DNS_HOST_PORT:-53}:53/tcp"
    depends_on:
      postgres:
        condition: service_healthy
      traefik:
        condition: service_started
    volumes:
      # The sources are bind-mounted from the host so that editing a file
      # hot-reloads the dev server. `develop.watch` is deliberately not used for
      # the sources: its `action: sync` is a no-op on several Compose releases
      # (it silently leaves the image's baked sources in place).
      - ./apps/notploy:/usr/src/app/apps/notploy
      - ./packages:/usr/src/app/packages
      - ./templates:/usr/src/app/templates
      # Those bind mounts shadow the node_modules installed in the dev image.
      # Anonymous volumes restore them from the image every time the container
      # is created — unlike named volumes, they are never stale after a
      # `docker compose build`. `make docker-dev` passes --build so the image
      # always matches pnpm-lock.yaml.
      - /usr/src/app/node_modules
      - /usr/src/app/apps/notploy/node_modules
      # Next's build output stays inside the container: the dev server runs as
      # root, so a bind-mounted .next would leave root-owned files in the
      # repository and break `make clean`.
      - /usr/src/app/apps/notploy/.next
      - /usr/src/app/packages/cli/node_modules
      - /usr/src/app/packages/github/node_modules
      - /usr/src/app/packages/mcp/node_modules
      - /usr/src/app/packages/sdk/node_modules
      - /usr/src/app/packages/server/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
      - notploy-config:/etc/notploy
      - notploy-docker:/root/.docker
    develop:
      # Rebuilding on a lockfile change refreshes the node_modules anonymous
      # volumes above as soon as a dependency is added or updated.
      watch:
        - action: rebuild
          path: pnpm-lock.yaml
    networks:
      - notploy

networks:
  notploy:
    name: notploy
    driver: bridge

volumes:
  notploy-postgres-data:
    name: notploy-postgres-data
  notploy-config:
    name: notploy-config
  notploy-docker:
    name: notploy-docker
