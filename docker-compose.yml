# Notploy — canonical Compose topology.
#
# The topology follows ZenthCloud's profile-driven model: one service
# definition per runtime role, with prod/dev selected by profiles and build
# arguments rather than duplicated production/development services.
#
#   Production: docker compose --profile prod up -d --build
#   Development: NOTPLOY_BUILD_TARGET=dev NOTPLOY_MODE=development \
#                NODE_ENV=development docker compose --profile dev up --build
#   Status: docker compose --profile status up -d --build status
#
# The application remains a single monolithic control-plane process (Next.js +
# API + workers). Unlike ZenthCloud, it is not split into client/api containers.
# Notploy-specific deployment requirements remain explicit below:
#   - Traefik is the edge router and shares the config volume with the app.
#   - The app controls the host Docker Engine through its socket (not DinD).
#   - Deployed workloads and Traefik share the external notploy-network.
#   - PostgreSQL and Redis are isolated on a private Compose network.
#
# NOTPLOY_BUILD_TARGET selects the Dockerfile target:
#   selfhosted | cloud | console | dev
# NOTPLOY_FLAVOR remains the product/entitlement selector:
#   selfhosted | cloud | console
#
# Production and development are mutually exclusive: they publish the same
# host ports and use the same persistent volumes. Stop one profile before
# starting the other.

name: notploy

# Shared control-plane environment. Credentials are only injected into the
# control-plane service; PostgreSQL and Redis remain private network services.
x-notploy-environment: &notploy-environment
  NODE_ENV: ${NODE_ENV:-production}
  NODE_NO_WARNINGS: "1"
  TZ: ${TZ:-UTC}
  PORT: 3000
  HOST: 0.0.0.0
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  DATABASE_URL: postgres://${POSTGRES_USER:-notploy}:${POSTGRES_PASSWORD:-notploy}@postgres:5432/${POSTGRES_DB:-notploy}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-notploy-insecure-default-change-me}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://${NOTPLOY_APP_HOST:-app.notploy.localhost}}
  BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://${NOTPLOY_APP_HOST:-app.notploy.localhost},http://localhost:3000,http://127.0.0.1:3000}
  IS_CLOUD: ${IS_CLOUD:-false}
  NOTPLOY_FLAVOR: ${NOTPLOY_FLAVOR:-selfhosted}
  NOTPLOY_PRODUCT: ${NOTPLOY_PRODUCT:-}
  NOTPLOY_SKIP_IDENTITY: ${NOTPLOY_SKIP_IDENTITY:-0}
  NOTPLOY_ENTITLEMENT: ${NOTPLOY_ENTITLEMENT:-}
  NOTPLOY_ENTITLEMENT_FILE: ${NOTPLOY_ENTITLEMENT_FILE:-}
  NOTPLOY_ENTITLEMENT_PUBLIC_KEY_FILE: ${NOTPLOY_ENTITLEMENT_PUBLIC_KEY_FILE:-/etc/notploy/identity/entitlement-ca.pub}
  NOTPLOY_DNS_SERVER: ${NOTPLOY_DNS_SERVER:-true}
  NOTPLOY_DNS_PORT: "53"
  NOTPLOY_DNS_UPSTREAM: ${NOTPLOY_DNS_UPSTREAM:-1.1.1.1,8.8.8.8}
  NOTPLOY_CONFIG_PATH: /etc/notploy
  NOTPLOY_GATEWAY_ERRORS_IMAGE: ${NOTPLOY_GATEWAY_ERRORS_IMAGE:-${NOTPLOY_IMAGE:-ghcr.io/skygenesisenterprise/notploy}:${NOTPLOY_VERSION:-latest}}
  NOTPLOY_GATEWAY_ERRORS_COMMAND: ${NOTPLOY_GATEWAY_ERRORS_COMMAND:-}
  NOTPLOY_TEMPLATES_DIR: /app/templates/blueprints
  NOTPLOY_ROLE: app

services:
  # -------------------------------------------------------------------------
  # GROUP 1 — DATABASE
  # -------------------------------------------------------------------------
  postgres:
    profiles: ["prod", "dev"]
    image: postgres:16-alpine
    container_name: notploy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notploy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notploy}
      POSTGRES_DB: ${POSTGRES_DB:-notploy}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---encoding=UTF8}
    volumes:
      - notploy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - notploy-internal

  # -------------------------------------------------------------------------
  # GROUP 2 — CACHE / QUEUE
  # Redis is authenticated and persistent. It is not exposed on the host.
  # -------------------------------------------------------------------------
  redis:
    profiles: ["prod", "dev"]
    image: redis:7-alpine
    container_name: notploy-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - notploy-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - notploy-internal

  # -------------------------------------------------------------------------
  # GROUP 3 — EDGE / REVERSE PROXY
  # Traefik stays attached to the long-lived external workload network so it
  # can route both Notploy-managed applications and the control plane.
  # -------------------------------------------------------------------------
  traefik:
    profiles: ["prod", "dev"]
    image: traefik:v${TRAEFIK_VERSION:-3.6.25}
    container_name: notploy-traefik
    restart: unless-stopped
    command:
      - --configFile=/etc/notploy/traefik/traefik.yml
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "${TRAEFIK_HTTPS_PORT:-443}:443/udp"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - notploy-config:/etc/notploy
    networks:
      - notploy

  # -------------------------------------------------------------------------
  # GROUP 4 — CONTROL PLANE
  # One service definition, one image contract. Build target and runtime mode
  # change between prod/dev; no parallel notploy-dev service or duplicated env.
  # -------------------------------------------------------------------------
  notploy:
    profiles: ["prod", "dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: ${NOTPLOY_BUILD_TARGET:-${NOTPLOY_FLAVOR:-selfhosted}}
      args:
        PNPM_VERSION: ${PNPM_VERSION:-10.22.0}
        NOTPLOY_VERSION: ${NOTPLOY_VERSION:-latest}
    image: ${NOTPLOY_IMAGE:-ghcr.io/skygenesisenterprise/notploy}:${NOTPLOY_VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *notploy-environment
      NODE_ENV: ${NODE_ENV:-production}
      NOTPLOY_MODE: ${NOTPLOY_MODE:-production}
      NEXT_TELEMETRY_DISABLED: "1"
      NOTPLOY_ALLOW_UNLICENSED_DEV: ${NOTPLOY_ALLOW_UNLICENSED_DEV:-0}
      NOTPLOY_TEMPLATES_DIR: ${NOTPLOY_TEMPLATES_DIR:-/app/templates/blueprints}
      NOTPLOY_GATEWAY_ERRORS_COMMAND: ${NOTPLOY_GATEWAY_ERRORS_COMMAND:-}
      NOTPLOY_GATEWAY_ERRORS_WORKDIR: ${NOTPLOY_GATEWAY_ERRORS_WORKDIR:-}
      CHOKIDAR_USEPOLLING: ${DEV_POLLING:-false}
      WATCHPACK_POLLING: ${DEV_POLLING:-false}
    ports:
      - "${NOTPLOY_PORT:-3000}:3000"
      - "${NOTPLOY_DNS_HOST_PORT:-53}:53/udp"
      - "${NOTPLOY_DNS_HOST_PORT:-53}:53/tcp"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      traefik:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/entrypoint.sh", "healthcheck"]
      interval: 30s
      timeout: ${NOTPLOY_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${NOTPLOY_HEALTHCHECK_RETRIES:-5}
      start_period: ${NOTPLOY_HEALTHCHECK_START_PERIOD:-90s}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=notploy-network"
      - "traefik.http.routers.notploy-app.rule=Host(`${NOTPLOY_APP_HOST:-app.notploy.localhost}`)"
      - "traefik.http.routers.notploy-app.entrypoints=web"
      - "traefik.http.routers.notploy-app.service=notploy-app"
      - "traefik.http.services.notploy-app.loadbalancer.server.port=3000"
    volumes:
      # Host Docker Engine integration is intentional: this is not DinD.
      - /var/run/docker.sock:/var/run/docker.sock
      - notploy-config:/etc/notploy
      - notploy-docker:/root/.docker
      - ./templates:/app/templates:ro
      # Development source mounts are inert in the production image (/app).
      # The dev image runs from /usr/src/app and sees edits immediately.
      - ./apps/notploy:/usr/src/app/apps/notploy
      - ./packages:/usr/src/app/packages
      - ./templates:/usr/src/app/templates
      - /usr/src/app/node_modules
      - /usr/src/app/apps/notploy/node_modules
      - /usr/src/app/apps/notploy/.next
      - /usr/src/app/packages/cli/node_modules
      - /usr/src/app/packages/github/node_modules
      - /usr/src/app/packages/mcp/node_modules
      - /usr/src/app/packages/sdk/node_modules
      - /usr/src/app/packages/server/node_modules
    develop:
      watch:
        - action: rebuild
          path: pnpm-lock.yaml
    networks:
      notploy-internal: {}
      notploy:
        aliases:
          - notploy

  # -------------------------------------------------------------------------
  # GROUP 5 — STATUS (independent product)
  # No database, Redis, Traefik or Docker socket. Its SQLite state is isolated.
  # Kept as separate prod/dev targets because Status is a distinct application.
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # GROUP 5 — STATUS (independent product)
  # One service definition, with prod/dev selected by profile and build target.
  # It has no PostgreSQL, Redis, Traefik or Docker socket dependency.
  # -------------------------------------------------------------------------
  status:
    profiles: ["status", "dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: ${NOTPLOY_STATUS_BUILD_TARGET:-status}
      args:
        NOTPLOY_VERSION: ${NOTPLOY_VERSION:-latest}
    image: ${NOTPLOY_STATUS_IMAGE:-${STATUS_IMAGE:-ghcr.io/skygenesisenterprise/notploy-status}:${NOTPLOY_VERSION:-latest}}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NOTPLOY_MODE: ${NOTPLOY_MODE:-production}
      NOTPLOY_APP: status
      NOTPLOY_ROLE: status
      PORT: 4100
      HOSTNAME: 0.0.0.0
      STATUS_DATA_DIR: /data
      STATUS_PUBLIC_URL: ${STATUS_PUBLIC_URL:-http://localhost:4100}
      STATUS_DEFAULT_PAGE: ${STATUS_DEFAULT_PAGE:-}
      STATUS_LOG_LEVEL: ${STATUS_LOG_LEVEL:-info}
      STATUS_SECRET_KEY: ${STATUS_SECRET_KEY:-}
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: ${DEV_POLLING:-false}
      WATCHPACK_POLLING: ${DEV_POLLING:-false}
      TZ: ${TZ:-UTC}
    ports:
      - "${STATUS_PORT:-4100}:4100"
    volumes:
      # These source mounts are consumed by the status-dev target and are inert
      # in the production image, which runs its standalone bundle from /app.
      - ./apps/status:/usr/src/app/apps/status
      - ./packages/status:/usr/src/app/packages/status
      - /usr/src/app/node_modules
      - /usr/src/app/apps/status/node_modules
      - /usr/src/app/packages/status/node_modules
      - /usr/src/app/apps/status/.next
      - ${STATUS_DATA_VOLUME:-notploy-status-data}:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/entrypoint.sh", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    develop:
      watch:
        - action: rebuild
          path: pnpm-lock.yaml
    networks:
      - status-internal

# The external workload network is deliberately not owned by Compose: deployed
# applications can outlive the Notploy stack and Traefik must keep routing them.
networks:
  notploy:
    name: notploy-network
    external: true
  notploy-internal:
    name: notploy-internal
    driver: bridge
  status-internal:
    name: notploy-status-internal
    driver: bridge

volumes:
  notploy-postgres-data:
    name: notploy-postgres-data
  notploy-redis-data:
    name: notploy-redis-data
  notploy-config:
    name: notploy-config
  notploy-docker:
    name: notploy-docker
  notploy-status-data:
    name: notploy-status-data
  notploy-status-dev-data:
    name: notploy-status-dev-data
