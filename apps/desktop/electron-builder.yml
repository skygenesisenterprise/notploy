# Packaging for the Notploy desktop client.
#
# The main process, the preload and the renderer are all bundled into `dist/`
# (esbuild for the Node side, Vite for the browser side). Nothing needs to be
# resolved from `node_modules` at runtime, so `files` is deliberately narrow: a
# packaged app ships `dist/`, its manifest and the icon.
#
# One icon, three platforms: electron-builder derives the macOS `.icns` and the
# Windows `.ico` from the 1024x1024 PNG produced by `pnpm generate:icon`.
appId: com.notploy.desktop
productName: Notploy
copyright: Copyright © 2026 Sky Genesis Enterprise

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - package.json
  # Read at runtime for the window and taskbar icon, and masked by the
  # renderer for the in-app mark. Generated by `pnpm generate:icon`.
  - assets/notploy.svg
  - assets/icon.png

# The renderer bundle already embeds every dependency, and the main bundle
# inlines the SDK, so unpacking node_modules would only inflate the installer.
asar: true
npmRebuild: false

mac:
  category: public.app-category.developer-tools
  # Required for `safeStorage` to reach the login Keychain on a signed build, and
  # for the hardened runtime to be accepted by Gatekeeper.
  hardenedRuntime: true
  gatekeeperAssess: false
  icon: assets/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  # Signing and notarization are environment-driven: electron-builder reads
  # CSC_LINK / CSC_KEY_PASSWORD (or a keychain identity) and, for notarization,
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID. Without them a build
  # still succeeds but is unsigned, which is fine for local testing only.
  notarize: false

dmg:
  title: Notploy ${version}

win:
  icon: assets/icon.png
  target:
    # `nsis` is a per-user installer that needs no elevation, which matches how
    # the app stores its data (per-user). `portable` is the single-file build for
    # a machine where nothing may be installed.
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
        - arm64
  # Signing is environment-driven too (CSC_LINK / CSC_KEY_PASSWORD, or a
  # certificate in the Windows store). Unsigned installers show SmartScreen
  # warnings, so a release build is expected to sign.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Notploy

linux:
  category: Development
  maintainer: Sky Genesis Enterprise
  synopsis: Notploy desktop client
  description: >-
    Native client to control and operate one or several Notploy instances:
    deployments, containers, servers and logs from a single window.
  icon: assets/icon.png
  # One target per distribution family, because the client is downloaded straight
  # from a GitHub Release and there is no repository to install from: the
  # AppImage needs no installation at all, `deb`/`rpm`/`pacman` fit the matching
  # distribution, and `tar.gz` is the fallback that unpacks anywhere — including
  # a machine where FUSE is unavailable and an AppImage cannot run.
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
    - target: pacman
      arch:
        - x64
        - arm64
    - target: tar.gz
      arch:
        - x64
        - arm64
  # The Debian, RPM and pacman packages need a maintainer and a category, both
  # set above.

# Release notes and the changelog live in the repository, not in the bundle.
publish: null
