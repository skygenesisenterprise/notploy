# Packaging for the Notploy desktop client, which lives in `electron/` inside
# the `apps/notploy` workspace package (the same package that builds the web
# app). The main process, the preload and the renderer are all bundled into
# `electron/dist/` (esbuild for the Node side, Vite for the browser side).
# Nothing needs to be resolved from `node_modules` at runtime, so `files` is
# deliberately narrow: a packaged app ships `electron/dist/`, the workspace
# manifest and the icon — and their paths inside the asar mirror the source
# tree, which is what lets the main process resolve the renderer entry point
# and the icon identically in a dev session and in a packaged app.
#
# One icon, three platforms: electron-builder derives the macOS `.icns` and the
# Windows `.ico` from the 1024x1024 PNG produced by `pnpm desktop:generate:icon`.
appId: com.notploy.desktop
productName: Notploy
copyright: Copyright © 2026 Sky Genesis Enterprise

directories:
  output: electron/release
  buildResources: electron/assets

files:
  - electron/dist/**/*
  - package.json
  # Read at runtime for the window and taskbar icon, and masked by the
  # renderer for the in-app mark. Generated by `pnpm desktop:generate:icon`.
  - electron/assets/notploy.svg
  - electron/assets/icon.png

# The renderer bundle already embeds every dependency, and the main bundle
# inlines the SDK, so unpacking node_modules would only inflate the installer.
asar: true
npmRebuild: false

mac:
  category: public.app-category.developer-tools
  # Required for `safeStorage` to reach the login Keychain on a signed build, and
  # for the hardened runtime to be accepted by Gatekeeper.
  hardenedRuntime: true
  gatekeeperAssess: false
  icon: electron/assets/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  # Signing and notarization are environment-driven: electron-builder reads
  # CSC_LINK / CSC_KEY_PASSWORD (or a keychain identity) and, for notarization,
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID. Without them a build
  # still succeeds but is unsigned, which is fine for local testing only.
  notarize: false

dmg:
  title: Notploy ${version}

win:
  icon: electron/assets/icon.png
  target:
    # `nsis` is a per-user installer that needs no elevation, which matches how
    # the app stores its data (per-user). `portable` is the single-file build for
    # a machine where nothing may be installed.
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
        - arm64
  # Signing is environment-driven too (CSC_LINK / CSC_KEY_PASSWORD, or a
  # certificate in the Windows store). Unsigned installers show SmartScreen
  # warnings, so a release build is expected to sign.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Notploy
  # Required, and the only thing that differs from macOS and Linux: the Windows
  # artifact name carries no architecture by default, so `x64` and `arm64` of
  # the same target both wrote `release/Notploy Setup 1.0.2.exe` and the second
  # one overwrote the first. The release then carried two Windows files where
  # its notes promise four, and each was a single architecture wearing the pair's
  # name. `${arch}` in the name is what keeps them apart.
  artifactName: Notploy-Setup-${version}-${arch}.${ext}

# `portable` is the other `.exe`, and two targets cannot share a name any more
# than two architectures can, so it gets one of its own rather than reusing the
# installer's.
portable:
  artifactName: Notploy-Portable-${version}-${arch}.${ext}

linux:
  # Required: without it the AppImage target falls back to the package name
  # `@notploy/app`, and the `@` is not a legal character for the launcher
  # name and the squashfs paths it is embedded into. It is scoped to `linux` on
  # purpose — at the top level it would also become `productFilename` and rename
  # the macOS bundle and the Windows binary, which must stay `Notploy`.
  executableName: notploy
  # Required for the same reason, and for the same scoped package name: every
  # Linux target except AppImage builds its artifact name from `${name}`, so
  # `deb`, `rpm`, `pacman` and `tar.gz` all wanted to write
  # `release/@notploy/app-<version>.deb` — a path with a directory in it
  # rather than a file, which the release's staging step then skipped in
  # silence, and the release shipped one asset out of ten. Naming them here
  # keeps every format flat, one name per architecture, with the scope nowhere
  # in sight.
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: Development
  maintainer: Sky Genesis Enterprise
  synopsis: Notploy desktop client
  description: >-
    Native client to control and operate one or several Notploy instances:
    deployments, containers, servers and logs from a single window.
  icon: electron/assets/icon.png
  # One target per distribution family, because the client is downloaded straight
  # from a GitHub Release and there is no repository to install from: the
  # AppImage needs no installation at all, `deb`/`rpm`/`pacman` fit the matching
  # distribution, and `tar.gz` is the fallback that unpacks anywhere — including
  # a machine where FUSE is unavailable and an AppImage cannot run.
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
    - target: pacman
      arch:
        - x64
        - arm64
    - target: tar.gz
      arch:
        - x64
        - arm64
  # The Debian, RPM and pacman packages need a maintainer and a category, both
  # set above.

# Release notes and the changelog live in the repository, not in the bundle.
publish: null
